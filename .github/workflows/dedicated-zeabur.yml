name: Dedicated Zeabur CI

# Personal fast path for rdmclin2 only. Does not replace Test CI.
# GitHub-hosted ubuntu-latest jobs in test.yml still run as usual.
# Requires three Idle runners labeled lobe-zeabur-linux.

on:
  pull_request:
    branches:
      - main
      - canary
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/claude*.yml'
      - '.github/workflows/issue-*.yml'
      - '.github/workflows/release*.yml'
      - '.github/workflows/sync*.y*ml'
      - '.github/workflows/auto-*.yml'
      - '.github/workflows/manual-*.yml'
      - '.github/workflows/lighthouse.yml'
      - '.github/workflows/bundle-analyzer.yml'

concurrency:
  group: dedicated-zeabur-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-app:
    # Machine hook also rejects other actors. This if skips the job before queueing.
    if: ${{ github.actor == 'rdmclin2' && github.event.pull_request.draft == false }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [1, 2, 3]
    name: Dedicated Test App (shard ${{ matrix.shard }}/3)
    runs-on: [self-hosted, lobe-zeabur-linux]
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Checkout
        env:
          REF_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REF_SHA}"
          git checkout --force FETCH_HEAD

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install deps
        run: pnpm install

      - name: Run tests
        run: bunx vitest --coverage --silent='passed-only' --reporter=default --project app --shard=${{ matrix.shard }}/3

      - name: Cleanup workspace
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.[!.]* || true
