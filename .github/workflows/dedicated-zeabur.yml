name: Dedicated Zeabur CI

# Personal fast path for rdmclin2 only. Does not replace Test CI.
# GitHub-hosted ubuntu-latest jobs in test.yml still run as usual.
# Three runners share one Linux user, so tool installs must stay out of $HOME.

on:
  pull_request:
    branches:
      - main
      - canary
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/claude*.yml'
      - '.github/workflows/issue-*.yml'
      - '.github/workflows/release*.yml'
      - '.github/workflows/sync*.y*ml'
      - '.github/workflows/auto-*.yml'
      - '.github/workflows/manual-*.yml'
      - '.github/workflows/lighthouse.yml'
      - '.github/workflows/bundle-analyzer.yml'

concurrency:
  group: dedicated-zeabur-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-app:
    # Machine hook also rejects other actors. This if skips the job before queueing.
    if: ${{ github.actor == 'rdmclin2' && github.event.pull_request.draft == false }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [1, 2, 3]
    name: Dedicated Test App (shard ${{ matrix.shard }}/3)
    runs-on: [self-hosted, lobe-zeabur-linux]
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Checkout
        env:
          REF_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REF_SHA}"
          git checkout --force FETCH_HEAD

      # Do not use ./.github/actions/setup-env here. Its pnpm step installs into
      # ~/setup-pnpm. Three runners share that home and race on the same directory.
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.11.1'
          package-manager-cache: false

      - name: Install deps
        run: pnpm install

      - name: Run tests
        run: bunx vitest --coverage --silent='passed-only' --reporter=default --project app --shard=${{ matrix.shard }}/3
