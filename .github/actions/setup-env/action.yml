name: Setup Environment
description: Setup Node.js, pnpm (install) and Bun (script runner) for workflows

inputs:
  node-version:
    description: Node.js version
    required: false
    default: '24.11.1'
  package-manager-cache:
    description: Pass-through to actions/setup-node package-manager-cache
    required: false
    default: 'false'
  bun-version:
    description: Bun version
    required: false
    default: 'canary'

runs:
  using: composite
  steps:
    # Several self-hosted runners share one Linux user. Give each runner its own
    # HOME so pnpm (~/setup-pnpm), bun (~/.bun) and caches do not race.
    - name: Isolate HOME on self-hosted runners
      if: runner.environment == 'self-hosted'
      shell: bash
      run: |
        home="$(dirname "$RUNNER_WORKSPACE")/_home"
        mkdir -p "$home"
        echo "HOME=$home" >> "$GITHUB_ENV"

    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        run_install: false

    - name: Install bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: ${{ inputs.package-manager-cache }}
